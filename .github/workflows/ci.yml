name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lu
          POSTGRES_PASSWORD: lu
          POSTGRES_DB: lucruri_utile
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lu -d lucruri_utile"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgres://lu:lu@localhost:5432/lucruri_utile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Migrațiile sunt sincronizate cu schema
        run: |
          pnpm db:generate --name ci_check
          git diff --exit-code --stat -- packages/db/migrations
          test -z "$(git status --porcelain -- packages/db/migrations)"
      - name: Migrațiile se aplică pe o bază goală
        run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm build
      - name: Browser pentru E2E
        run: pnpm --filter @lu/web exec playwright install --with-deps chromium
      # Build-ul de mai sus e în cache-ul Turbo, deci test:e2e nu îl refac.
      - run: pnpm test:e2e
      - name: Raport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
